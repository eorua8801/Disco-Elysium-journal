<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#22180a"/>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#3a2810"/>
      <stop offset="100%" stop-color="#22180a"/>
    </radialGradient>
  </defs>
  <!-- Amber diamond ◈ -->
  <text x="256" y="320" text-anchor="middle" dominant-baseline="middle"
    font-family="serif" font-size="280" fill="#c4782a">◈</text>
  <!-- Subtle glow -->
  <text x="256" y="320" text-anchor="middle" dominant-baseline="middle"
    font-family="serif" font-size="280" fill="#c4782a" opacity="0.3"
    filter="url(#glow)">◈</text>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
